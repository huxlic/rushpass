<!DOCTYPE html>
<html lang="en">

<head>
  <title></title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--[if mso]>
  <xml>
    <w:WordDocument xmlns:w="urn:schemas-microsoft-com:office:word">
      <w:DontUseAdvancedTypographyReadingMail />
    </w:WordDocument>
    <o:OfficeDocumentSettings>
      <o:PixelsPerInch>96</o:PixelsPerInch>
      <o:AllowPNG />
    </o:OfficeDocumentSettings>
  </xml>
  <![endif]-->
  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900"
        rel="stylesheet" type="text/css">
  <!--<![endif]-->
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      background-color: #f8f8f9;
    }
    
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: inherit !important;
    }
    
    #MessageViewBody a {
      color: inherit;
      text-decoration: none;
    }
    
    p {
      line-height: inherit;
    }
    
    .desktop_hide,
    .desktop_hide table {
      mso-hide: all;
      display: none;
      max-height: 0px;
      overflow: hidden;
    }
    
    .image_block img + div {
      display: none;
    }
    
    sup,
    sub {
      font-size: 75%;
      line-height: 0;
    }
    
    @media (max-width: 660px) {
      .icons-inner {
        text-align: center;
      }
      
      .icons-inner td {
        margin: 0 auto;
      }
      
      .image_block div.fullWidth {
        max-width: 100% !important;
      }
      
      .row-content {
        width: 100% !important;
      }
      
      .stack .column {
        width: 100% !important;
        display: block;
      }
      
      .mobile_hide {
        min-height: 0;
        max-height: 0;
        max-width: 0;
        display: none;
        overflow: hidden;
        font-size: 0;
      }
      
      .desktop_hide,
      .desktop_hide table {
        display: table !important;
        max-height: none !important;
      }
      
      .desktop_hide table.icons-inner,
      .social_block .social-table {
        display: inline-block !important;
      }
    }
  </style>
  <!--[if mso ]>
  <style>sup, sub {
    font-size: 100% !important;
  }
  
  sup {
    mso-text-raise: 10%
  }
  
  sub {
    mso-text-raise: -10%
  }</style><![endif]-->
</head>

<body style="margin: 0; padding: 0; background-color: #f8f8f9;">
<table role="presentation"
       style="width: 100%; border-collapse: collapse; background-color: #f8f8f9; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
  <tbody>
  <tr>
    <td style="padding: 0;">
      <!-- Top Accent Bar -->
      <table role="presentation"
             style="width: 100%; border-collapse: collapse; background-color: #1aa19c; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
        <tbody>
        <tr>
          <td style="padding: 0;">
            <table role="presentation" class="row-content stack"
                   style="width: 640px; margin: 0 auto; border-collapse: collapse; background-color: #1aa19c; color: #000000; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
              <tbody>
              <tr>
                <td
                  style="width: 640px; font-weight: 400; text-align: left; vertical-align: top; padding: 0; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                  <table role="presentation"
                         style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                    <tr>
                      <td style="font-size: 1px; line-height: 1px; border-top: 4px solid #1AA19C; padding: 0;"><span
                        style="word-break: break-word;">&#8202;</span></td>
                    </tr>
                  </table>
                </td>
              </tr>
              </tbody>
            </table>
          </td>
        </tr>
        </tbody>
      </table>
      
      <!-- RENDERED BODY CONTENT -->
      {{{body}}}
      
      <!-- Footer Section -->
      <table role="presentation"
             style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
        <tbody>
        <tr>
          <td style="padding: 0;">
            <table role="presentation" class="row-content stack"
                   style="width: 640px; margin: 0 auto; border-collapse: collapse; background-color: #2b303a; color: #000000; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
              <tbody>
              <tr>
                <td
                  style="width: 640px; font-weight: 400; text-align: left; vertical-align: top; padding: 0; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                  <table role="presentation"
                         style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                    <tr>
                      <td style="font-size: 1px; line-height: 1px; border-top: 4px solid #1AA19C; padding: 0;"><span
                        style="word-break: break-word;">&#8202;</span></td>
                    </tr>
                  </table>
                  <table role="presentation"
                         style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                    <tr>
                      <td style="width: 100%; text-align: center; padding: 0;">
                        <div style="max-width: 640px; margin: 0 auto;"><img
                          src="https://d1oco4z2z1fhwp.cloudfront.net/templates/default/1361/footer.png"
                          alt="Footer graphic"
                          style="display: block; height: auto; border: 0; width: 100%; max-width: 100%;"></div>
                      </td>
                    </tr>
                  </table>
                  <table role="presentation"
                         style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                    <tr>
                      <td style="padding: 28px 10px 10px 10px; text-align: center;">
                        <table role="presentation" class="social-table"
                               style="width: 188px; margin: 0 auto; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                          <tr>
                            <td style="padding: 0;"><a href="https://www.facebook.com" target="_blank"><img
                              src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-outline-circle-white/facebook@2x.png"
                              width="32" alt="Facebook" style="display: block; height: auto; border: 0;"></a></td>
                            <td style="padding: 0 0 0 20px;"><a href="https://www.twitter.com" target="_blank"><img
                              src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-outline-circle-white/twitter@2x.png"
                              width="32" alt="Twitter" style="display: block; height: auto; border: 0;"></a></td>
                            <td style="padding: 0 0 0 20px;"><a href="https://www.instagram.com" target="_blank"><img
                              src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-outline-circle-white/instagram@2x.png"
                              width="32" alt="Instagram" style="display: block; height: auto; border: 0;"></a></td>
                            <td style="padding: 0 0 0 20px;"><a href="https://www.linkedin.com" target="_blank"><img
                              src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-outline-circle-white/linkedin@2x.png"
                              width="32" alt="LinkedIn" style="display: block; height: auto; border: 0;"></a></td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                  <table role="presentation"
                         style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                    <tr>
                      <td style="padding: 25px 40px 10px 40px; text-align: center;">
                        <table role="presentation"
                               style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                          <tr>
                            <td style="font-size: 1px; line-height: 1px; border-top: 1px solid #555961; padding: 0;">
                              <span style="word-break: break-word;">&#8202;</span></td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                  <table role="presentation"
                         style="width: 100%; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
                    <tr>
                      <td style="padding: 20px 40px 30px 40px;">
                        <div
                          style="color: #555555; font-family: Montserrat, 'Trebuchet MS', 'Lucida Grande', sans-serif; font-size: 12px; line-height: 1.2; text-align: left;">
                          <p style="margin: 0;"><span style="color: #95979c;">Rushpass Copyright © 2026</span></p>
                        </div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
              </tbody>
            </table>
          </td>
        </tr>
        </tbody>
      </table>
    </td>
  </tr>
  </tbody>
</table>
</body>

</html>
